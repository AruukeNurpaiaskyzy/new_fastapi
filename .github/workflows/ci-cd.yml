name: CI/CD Pipeline for FastAPI

# Когда запускать:
on:
  push:
    branches: [ main, master ]  # Когда пушишь в main
  pull_request:
    branches: [ main, master ]  # Когда создаешь Pull Request
  workflow_dispatch:            # Можно запустить вручную

# Переменные окружения
env:
  DOCKER_IMAGE: my-fastapi-app
  DOCKER_TAG: latest

jobs:
  # ============= JOB 1: ТЕСТЫ (CI) =============
  test:
    name: Run Tests
    runs-on: ubuntu-latest  # Бесплатный сервер от GitHub
    
    steps:
      # 1. Скачать код
      - name: Checkout code
        uses: actions/checkout@v4
      
      # 2. Установить Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      # 3. Установить зависимости
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov httpx
      
      # 4. Запустить тесты
      - name: Run tests
        run: |
          pytest test_main.py -v --cov=. --cov-report=xml
      
      # 5. Отправить отчет о покрытии кода (опционально)
      - name: Upload coverage report
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  # ============= JOB 2: ЛИНТЕР (проверка стиля кода) =============
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install linters
        run: |
          pip install flake8 black mypy
      
      - name: Run flake8 (проверка стиля)
        run: |
          flake8 . --count --max-complexity=10 --max-line-length=127 --statistics
      
      - name: Run black (проверка форматирования)
        run: |
          black --check . || echo "Запусти black . чтобы отформатировать"
      
      - name: Run mypy (проверка типов)
        run: |
          mypy . --ignore-missing-imports || true

  # ============= JOB 3: СБОРКА DOCKER ОБРАЗА =============
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [test, lint]  # Ждет пока тесты и линтер пройдут
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: ${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Scan for security issues
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }}
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true

  # ============= JOB 4: ПУШ В DOCKER HUB (CD) =============
  push:
    name: Push to Docker Hub
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }}
            ${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============= JOB 5: ДЕПЛОЙ НА СЕРВЕР (CD) =============
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Deploy to production server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}  # обычно 22
          script: |
            # Останавливаем старый контейнер
            docker stop my-fastapi-app || true
            docker rm my-fastapi-app || true
            
            # Тянем новый образ
            docker pull ${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }}
            
            # Запускаем новый контейнер
            docker run -d \
              --name my-fastapi-app \
              -p 8000:8000 \
              --restart always \
              ${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }}
            
            # Очищаем старые образы
            docker image prune -f
      
      - name: Send notification to Telegram (опционально)
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            🚀 Деплой завершен!
            Репозиторий: ${{ github.repository }}
            Ветка: ${{ github.ref_name }}
            Коммит: ${{ github.sha }}
            Автор: ${{ github.actor }}
            Статус: ✅ Успешно